<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dream Duck</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #080814;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #title {
    color: #ffdd00;
    font-size: 20px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 6px;
    text-shadow: 3px 3px 0 #ff4400;
    animation: flicker 4s infinite;
  }
  #subtitle {
    color: #8899ff;
    font-size: 10px;
    letter-spacing: 5px;
    margin-bottom: 12px;
    opacity: 0.7;
  }
  canvas {
    border: 2px solid #223;
    box-shadow: 0 0 40px #0033ff33, 0 0 80px #0011ff11;
    image-rendering: pixelated;
  }
  #hud {
    color: #6677cc;
    font-size: 9px;
    letter-spacing: 2px;
    margin-top: 8px;
    opacity: 0.5;
  }
  #scanlines {
    position: fixed;
    top:0;left:0;right:0;bottom:0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 2px,
      rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px
    );
    z-index: 10;
  }
  @keyframes flicker {
    0%,100%{opacity:1}92%{opacity:1}93%{opacity:.6}94%{opacity:1}97%{opacity:.8}98%{opacity:1}
  }
</style>
</head>
<body>
<div id="scanlines"></div>
<div id="title">★ DREAM DUCK ★</div>
<div id="subtitle">20/05/2026</div>
<canvas id="c" width="480" height="520"></canvas>
<div id="hud">POLYS: 148 · VRAM: 2MB · FPS: 30</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setSize(480, 520);
renderer.setPixelRatio(0.6);
renderer.shadowMap.enabled = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a18);

const camera = new THREE.PerspectiveCamera(55, 480/520, 0.1, 100);
camera.position.set(0, 2.2, 7.5);
camera.lookAt(0, 2.0, 0);

const ambient = new THREE.AmbientLight(0x556677, 1.4);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(4, 8, 5);
scene.add(dirLight);
const rimLight = new THREE.DirectionalLight(0x3355aa, 0.6);
rimLight.position.set(-4, 3, -3);
scene.add(rimLight);

// PS1-style flat material with vertex jitter
function mat(color) {
  return new THREE.MeshLambertMaterial({ color, flatShading: true });
}

// Colors matching reference
const C = {
  white:    mat(0xc8e8d8),  // light greenish white face
  beak:     mat(0xe8a020),  // golden yellow beak
  beakBot:  mat(0xd08010),  // darker beak bottom
  blueDark: mat(0x1040a0),  // dark blue hat & shirt
  blueMid:  mat(0x2060cc),  // mid blue shirt
  blueLight:mat(0x4488ee),  // light blue stripes
  navy:     mat(0x0a2050),  // very dark blue hat brim
  yellow:   mat(0xe0a000),  // legs/feet yellow-orange
  orange:   mat(0xc07000),  // feet darker
  red:      mat(0xcc1111),  // bow tie
  black:    mat(0x0a0a0a),  // eyes
  eyeW:     mat(0xffffff),  // eye white
  cream:    mat(0xf0dda0),  // hat band
  hatBand:  mat(0x000820),  // dark hat band
  ground:   mat(0x151525),
  gcheck:   mat(0x1a2035),
};

function jitter(geo, amt=0.04) {
  const pos = geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    pos.setX(i, pos.getX(i)+(Math.random()-.5)*amt);
    pos.setY(i, pos.getY(i)+(Math.random()-.5)*amt);
    pos.setZ(i, pos.getZ(i)+(Math.random()-.5)*amt);
  }
  geo.computeVertexNormals();
  return geo;
}

function box(w,h,d, m, x,y,z, jamt=0.035) {
  const g = jitter(new THREE.BoxGeometry(w,h,d,1,1,1), jamt);
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(x,y,z);
  return mesh;
}

function sph(r, m, x,y,z, seg=6) {
  const g = jitter(new THREE.SphereGeometry(r,seg,seg), 0.05);
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(x,y,z);
  return mesh;
}

const donald = new THREE.Group();

// =====================
// BODY - small & squat
// =====================
const body = box(1.4, 1.05, 1.0, C.blueMid, 0, 0.52, 0);
donald.add(body);

// White bib/shirt front
donald.add(box(0.85, 0.75, 0.12, C.white, 0, 0.58, 0.51));

// Blue horizontal stripes at bottom of shirt
donald.add(box(1.42, 0.1, 1.02, C.blueDark, 0, 0.05, 0));
donald.add(box(1.42, 0.08, 1.02, C.cream,   0,-0.03, 0));
donald.add(box(1.42, 0.1, 1.02, C.blueLight,0,-0.12, 0));

// Red bow tie - reference shows it clearly
const bowL = box(0.28,0.16,0.1, C.red, -0.16, 0.97, 0.52);
bowL.rotation.z = 0.4;
donald.add(bowL);
const bowR = box(0.28,0.16,0.1, C.red,  0.16, 0.97, 0.52);
bowR.rotation.z = -0.4;
donald.add(bowR);
donald.add(box(0.13,0.13,0.11, C.red, 0, 0.97, 0.52)); // center

// =====================
// NECK
// =====================
donald.add(box(0.5, 0.22, 0.45, C.white, 0, 1.1, 0.02));

// =====================
// HEAD - very large relative to body
// =====================
const headGroup = new THREE.Group();
headGroup.position.set(0, 1.85, 0.05);

// Main head shape - big round
const headMain = sph(0.88, C.white, 0, 0, 0, 8);
headGroup.add(headMain);

// Widen cheeks (face is wide)
headGroup.add(box(1.5, 0.7, 0.75, C.white, 0, -0.05, 0.1));
headGroup.add(box(1.3, 0.55, 0.65, C.white, 0,  0.15, 0.08));

// Back of head
headGroup.add(box(1.1, 1.0, 0.7, C.white, 0, 0, -0.25));

// =====================
// EYES - reference shows two black rect patches
// =====================
// Eye area background
headGroup.add(box(0.22, 0.24, 0.08, C.black, -0.3, 0.2, 0.78));
headGroup.add(box(0.22, 0.24, 0.08, C.black,  0.3, 0.2, 0.78));
// White gleam
headGroup.add(box(0.09, 0.10, 0.09, C.eyeW, -0.25, 0.26, 0.79));
headGroup.add(box(0.09, 0.10, 0.09, C.eyeW,  0.35, 0.26, 0.79));

// =====================
// BEAK - prominent, wide, flat
// =====================
// Top beak - wide and protruding
const beakTop = box(0.72, 0.22, 0.62, C.beak, 0, 0.05, 0.72);
headGroup.add(beakTop);
// Bottom beak - slightly lower and shorter
const beakBot2 = box(0.65, 0.20, 0.55, C.beakBot, 0, -0.17, 0.68);
headGroup.add(beakBot2);
// Beak front tip
headGroup.add(box(0.5, 0.15, 0.18, C.beak, 0, -0.06, 0.95));

donald.add(headGroup);

// =====================
// HAT - sailor cap, flat top, sits on top of head
// =====================
const hatGroup = new THREE.Group();
hatGroup.position.set(0, 2.72, -0.05);

// Brim - wide flat disc
hatGroup.add(box(1.55, 0.1, 1.35, C.blueDark, 0, 0, 0));
// Hat crown - squat cylinder-ish
hatGroup.add(box(1.25, 0.38, 1.05, C.blueDark, 0, 0.24, 0));
// Hat band
hatGroup.add(box(1.27, 0.08, 1.07, C.hatBand, 0, 0.07, 0));
// Yellow/cream band stripe
hatGroup.add(box(1.26, 0.05, 1.06, C.cream, 0, 0.13, 0));

donald.add(hatGroup);

// =====================
// ARMS - short stubby
// =====================
const lArmG = new THREE.Group();
lArmG.position.set(-0.82, 0.72, 0);
lArmG.add(box(0.32, 0.75, 0.32, C.blueMid, 0,-0.1, 0));
// Hand/mitten
lArmG.add(box(0.42, 0.30, 0.42, C.yellow, 0,-0.55, 0));
lArmG.rotation.z = 0.4;
donald.add(lArmG);

const rArmG = new THREE.Group();
rArmG.position.set(0.82, 0.72, 0);
rArmG.add(box(0.32, 0.75, 0.32, C.blueMid, 0,-0.1, 0));
rArmG.add(box(0.42, 0.30, 0.42, C.yellow, 0,-0.55, 0));
rArmG.rotation.z = -0.4;
donald.add(rArmG);

// =====================
// LEGS - short thick
// =====================
const lLegG = new THREE.Group();
lLegG.position.set(-0.35, -0.05, 0.05);
lLegG.add(box(0.35, 0.52, 0.35, C.yellow, 0, 0, 0));
// Foot - flat wide
lLegG.add(box(0.52, 0.16, 0.72, C.orange, 0, -0.34, 0.12));
donald.add(lLegG);

const rLegG = new THREE.Group();
rLegG.position.set(0.35, -0.05, 0.05);
rLegG.add(box(0.35, 0.52, 0.35, C.yellow, 0, 0, 0));
rLegG.add(box(0.52, 0.16, 0.72, C.orange, 0, -0.34, 0.12));
donald.add(rLegG);

// Tail fluff
const tail = box(0.42, 0.3, 0.22, C.white, 0, 0.55, -0.56);
tail.rotation.x = 0.5;
donald.add(tail);

donald.position.y = -1.6;
scene.add(donald);

// =====================
// GROUND - PS1 checkerboard
// =====================
const gnd = new THREE.Mesh(
  jitter(new THREE.PlaneGeometry(14,14,14,14), 0.02),
  C.ground
);
gnd.rotation.x = -Math.PI/2;
gnd.position.y = -2.2;
scene.add(gnd);

for(let i=-5;i<5;i++) for(let j=-5;j<5;j++) {
  if((i+j)%2===0) {
    const sq = new THREE.Mesh(
      jitter(new THREE.BoxGeometry(0.98,0.03,0.98),0.01),
      C.gcheck
    );
    sq.position.set(i*1+0.5,-2.19,j*1+0.5);
    scene.add(sq);
  }
}

// =====================
// ANIMATE
// =====================
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.018;

  // PS1-style quantized slow rotation
  donald.rotation.y = Math.round(t * 0.5 * 48) / 48;

  // Idle bob
  donald.position.y = -1.6 + Math.sin(t * 1.8) * 0.07;

  // Arm swing
  lArmG.rotation.z = 0.4 + Math.sin(t*2)*0.3;
  rArmG.rotation.z = -0.4 - Math.sin(t*2)*0.3;

  // Leg waddle
  lLegG.rotation.x = Math.sin(t*2)*0.18;
  rLegG.rotation.x = -Math.sin(t*2)*0.18;

  // Head slight tilt for personality
  headGroup.rotation.z = Math.sin(t*1.2)*0.05;

  renderer.render(scene, camera);
}
animate();
</script>
<a href="https://www.instagram.com/dreamduckvevo/">Dream Duck</a>
</body>
</html>
